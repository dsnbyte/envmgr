[package]
name = "envmgr"
version = "0.1.0"
edition = "2021"
description = "Super lightweight TUI environment manager with Phase.dev integration"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
chacha20poly1305 = "0.10"
crossterm = "0.28"
getrandom = "0.2"
hex = "0.4"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
